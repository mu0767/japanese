name: Audit Korean dictionary provenance
on:
  push:
    paths:
      - '.github/workflows/audit-korean.yml'
      - 'qa/audit-korean.cjs'
      - 'korean-data.js'
      - 'korean-provenance.json'
      - 'korean-kengdic-provenance.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report source analysis and translation risk
        run: node qa/audit-korean.cjs
