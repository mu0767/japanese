name: Verify public Kotoba Pages
on:
  push:
    paths:
      - '.github/workflows/verify-live.yml'
      - 'qa/verify-live.cjs'
      - 'qa/verify-live-browser.cjs'
      - 'index.html'
      - 'app.js'
      - 'cloud-sync.js'
      - 'style.css'
      - 'qa/qa-cloud-browser.cjs'
      - 'cloud-sync-ui.js'
      - 'worker/kotoba-sync.js'
      - 'core.js'
      - 'audio.js'
      - 'audio-offline.js'
      - 'test-audio-offline.cjs'
      - 'audio-data.js'
      - 'qa/audit-pronunciation.cjs'
      - 'qa/verify-shichi-browser.cjs'
      - 'korean-data.js'
      - 'korean-krdict-data.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm GitHub Pages deployment files (retry while publishing)
        shell: bash
        run: |
          success=0
          for attempt in $(seq 1 15); do
            if node qa/verify-live.cjs https://mu0767.github.io/japanese/; then success=1; break; fi
            sleep 8
          done
          test "$success" = 1
      - name: Unit tests for progress and kanji glossary
        run: |
          node test.cjs
          node test-kanji.cjs
          node test-audio.cjs
          node test-audio-offline.cjs
          node qa/audit-pronunciation.cjs --require-assets
          node test-progress.cjs
          node --check quick-export.js
      - name: Install browser harness
        run: npm install --no-save playwright-core
      - name: 'Regression test: PC and mobile share the same mastered-word counts'
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/qa-cloud-browser.cjs
      - name: Verify real mobile browser interactions
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/verify-live-browser.cjs https://mu0767.github.io/japanese/
      - name: Verify actual 七 pronunciation playback and replay
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node qa/verify-shichi-browser.cjs https://mu0767.github.io/japanese/
